<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" width="980" height="760" font-family="Segoe UI, Arial, sans-serif">
  <rect width="980" height="760" fill="#F8FAFC"/>
  <text x="490" y="34" font-size="18" font-weight="bold" text-anchor="middle" fill="#0F172A">FLOWCHART PENGGUNAAN APLIKASI DAILYTASK</text>

  <!-- Definitions for Arrowhead -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
  </defs>

  <!-- Start & Open App -->
  <rect x="415" y="55" width="150" height="36" rx="18" fill="#16A34A"/>
  <text x="490" y="78" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">MULAI</text>

  <line x1="490" y1="91" x2="490" y2="115" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="385" y="115" width="210" height="40" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="490" y="140" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">Membuka Aplikasi DailyTask</text>

  <!-- Decision: Memiliki Akun / Login -->
  <line x1="490" y1="155" x2="490" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <polygon points="490,180 585,220 490,260 395,220" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="490" y="216" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400E">Sudah Punya</text>
  <text x="490" y="231" font-size="11" font-weight="bold" text-anchor="middle" fill="#92400E">Akun?</text>

  <!-- Branch Left: Registrasi -->
  <line x1="395" y1="220" x2="230" y2="220" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="212" font-size="11" font-weight="bold" fill="#DC2626">Belum</text>
  <rect x="60" y="196" width="170" height="48" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="145" y="217" font-size="12" font-weight="bold" text-anchor="middle" fill="#1E3A8A">Registrasi Akun</text>
  <text x="145" y="233" font-size="10" text-anchor="middle" fill="#475569">(POST /api/register)</text>

  <!-- Arrow from Register to Login -->
  <path d="M 145 244 L 145 305 L 385 305" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Branch Down: Login -->
  <line x1="490" y1="260" x2="490" y2="285" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="515" y="275" font-size="11" font-weight="bold" fill="#16A34A">Sudah</text>
  <rect x="385" y="285" width="210" height="44" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="490" y="305" font-size="12" font-weight="bold" text-anchor="middle" fill="#1E3A8A">Login Pengguna (Email &amp; Sandi)</text>
  <text x="490" y="320" font-size="10" text-anchor="middle" fill="#475569">(POST /api/login -&gt; JWT Token)</text>

  <!-- Dashboard -->
  <line x1="490" y1="329" x2="490" y2="358" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="365" y="358" width="250" height="48" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="490" y="379" font-size="13" font-weight="bold" text-anchor="middle" fill="#14532D">Dashboard Screen</text>
  <text x="490" y="395" font-size="10" text-anchor="middle" fill="#166534">Ringkasan Progres &amp; Memilih Menu</text>

  <!-- Menu Distribution Line -->
  <line x1="490" y1="406" x2="490" y2="432" stroke="#334155" stroke-width="2"/>
  <line x1="120" y1="432" x2="860" y2="432" stroke="#334155" stroke-width="2"/>

  <!-- 4 Main Branches from Dashboard -->
  <!-- 1. Melihat Daftar Tugas -->
  <line x1="120" y1="432" x2="120" y2="460" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="35" y="460" width="170" height="46" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="120" y="480" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">Melihat Daftar Tugas</text>
  <text x="120" y="495" font-size="10" text-anchor="middle" fill="#475569">(GET /api/tasks)</text>

  <!-- 2. Menambah Tugas -->
  <line x1="365" y1="432" x2="365" y2="460" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="280" y="460" width="170" height="46" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="365" y="480" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">Menambah Tugas</text>
  <text x="365" y="495" font-size="10" text-anchor="middle" fill="#475569">(POST /api/tasks)</text>

  <!-- 3. Riwayat Aktivitas -->
  <line x1="615" y1="432" x2="615" y2="460" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="530" y="460" width="170" height="46" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="615" y="480" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">Riwayat Aktivitas</text>
  <text x="615" y="495" font-size="10" text-anchor="middle" fill="#475569">(Filter Tugas Selesai)</text>

  <!-- 4. Profil & Logout -->
  <line x1="860" y1="432" x2="860" y2="460" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="775" y="460" width="170" height="46" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="860" y="480" font-size="12" font-weight="bold" text-anchor="middle" fill="#991B1B">Profil &amp; Logout</text>
  <text x="860" y="495" font-size="10" text-anchor="middle" fill="#B91C1C">(POST /api/logout)</text>

  <!-- Sub-actions under Daftar Tugas: Detail -> Edit / Complete / Delete -->
  <line x1="120" y1="506" x2="120" y2="538" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="35" y="538" width="170" height="44" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2"/>
  <text x="120" y="558" font-size="12" font-weight="bold" text-anchor="middle" fill="#1E3A8A">Detail Tugas</text>
  <text x="120" y="573" font-size="10" text-anchor="middle" fill="#475569">(GET /api/tasks/{id})</text>

  <!-- Connect AddTask to TaskList -->
  <path d="M 365 506 L 365 522 L 205 522 L 205 483" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 3 Task Detail Actions -->
  <line x1="120" y1="582" x2="120" y2="605" stroke="#334155" stroke-width="2"/>
  <line x1="120" y1="605" x2="540" y2="605" stroke="#334155" stroke-width="2"/>

  <line x1="120" y1="605" x2="120" y2="628" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="35" y="628" width="170" height="44" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
  <text x="120" y="648" font-size="11" font-weight="bold" text-anchor="middle" fill="#0F172A">Mengubah Tugas</text>
  <text x="120" y="663" font-size="10" text-anchor="middle" fill="#475569">(PUT /api/tasks/{id})</text>

  <line x1="330" y1="605" x2="330" y2="628" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="245" y="628" width="170" height="44" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="330" y="648" font-size="11" font-weight="bold" text-anchor="middle" fill="#14532D">Menyelesaikan Tugas</text>
  <text x="330" y="663" font-size="10" text-anchor="middle" fill="#166534">(status = 'completed')</text>

  <line x1="540" y1="605" x2="540" y2="628" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="455" y="628" width="170" height="44" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2"/>
  <text x="540" y="648" font-size="11" font-weight="bold" text-anchor="middle" fill="#991B1B">Menghapus Tugas</text>
  <text x="540" y="663" font-size="10" text-anchor="middle" fill="#B91C1C">(DELETE /api/tasks/{id})</text>

  <!-- End Node under Logout -->
  <line x1="860" y1="506" x2="860" y2="695" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="785" y="695" width="150" height="36" rx="18" fill="#0F172A"/>
  <text x="860" y="718" font-size="13" font-weight="bold" text-anchor="middle" fill="#FFFFFF">SELESAI</text>
</svg>

