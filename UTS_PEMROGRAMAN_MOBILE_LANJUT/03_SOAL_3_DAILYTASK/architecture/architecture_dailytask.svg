<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="620" fill="#F8FAFC"/>
  <text x="450" y="34" font-size="18" font-weight="bold" text-anchor="middle" fill="#0F172A">ARSITEKTUR BERLAPIS REACT NATIVE – DAILYTASK</text>

  <defs>
    <marker id="archArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
    </marker>
  </defs>

  <!-- Layer 1: Presentation Layer -->
  <rect x="50" y="55" width="800" height="115" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="70" y="80" font-size="14" font-weight="bold" fill="#1E3A8A">1. PRESENTATION LAYER (UI &amp; NAVIGATION)</text>
  <rect x="70" y="92" width="235" height="62" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="187" y="118" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">React Navigation v7</text>
  <text x="187" y="136" font-size="10" text-anchor="middle" fill="#475569">AuthStack, BottomTabs, TaskStack</text>

  <rect x="330" y="92" width="240" height="62" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="450" y="118" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">9 Halaman Utama (Screens)</text>
  <text x="450" y="136" font-size="10" text-anchor="middle" fill="#475569">Login, Register, Dashboard, Tasks, dll.</text>

  <rect x="595" y="92" width="235" height="62" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="712" y="118" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">Reusable UI Components</text>
  <text x="712" y="136" font-size="10" text-anchor="middle" fill="#475569">TaskCard, PriorityBadge, ProgressCard</text>

  <!-- Arrow 1 to 2 -->
  <line x1="450" y1="170" x2="450" y2="200" stroke="#334155" stroke-width="2.5" marker-start="url(#archArrow)" marker-end="url(#archArrow)"/>

  <!-- Layer 2: Business Logic Layer -->
  <rect x="50" y="200" width="800" height="115" rx="12" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/>
  <text x="70" y="225" font-size="14" font-weight="bold" fill="#14532D">2. BUSINESS LOGIC LAYER (STATE MANAGEMENT &amp; HOOKS)</text>

  <rect x="70" y="237" width="245" height="62" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="192" y="263" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">Client State (AuthContext)</text>
  <text x="192" y="281" font-size="10" text-anchor="middle" fill="#475569">Sesi Login, User Profile, Theme</text>

  <rect x="335" y="237" width="245" height="62" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="457" y="263" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">Server State (TanStack Query)</text>
  <text x="457" y="281" font-size="10" text-anchor="middle" fill="#475569">useQuery, useMutation, Cache &amp; Retry</text>

  <rect x="600" y="237" width="230" height="62" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="715" y="263" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">Domain Logic &amp; Validators</text>
  <text x="715" y="281" font-size="10" text-anchor="middle" fill="#475569">Filter Prioritas, Validasi Form, Tanggal</text>

  <!-- Arrow 2 to 3 -->
  <line x1="450" y1="315" x2="450" y2="345" stroke="#334155" stroke-width="2.5" marker-start="url(#archArrow)" marker-end="url(#archArrow)"/>

  <!-- Layer 3: Data Layer -->
  <rect x="50" y="345" width="800" height="115" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="70" y="370" font-size="14" font-weight="bold" fill="#92400E">3. DATA LAYER (API SERVICE &amp; LOCAL STORAGE)</text>

  <rect x="70" y="382" width="245" height="62" rx="8" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="192" y="408" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">API Service Modules</text>
  <text x="192" y="426" font-size="10" text-anchor="middle" fill="#475569">authApi.js, taskApi.js, profileApi.js</text>

  <rect x="335" y="382" width="245" height="62" rx="8" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="457" y="408" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">Axios HTTP Client + Interceptors</text>
  <text x="457" y="426" font-size="10" text-anchor="middle" fill="#475569">Auto-inject Authorization Bearer JWT</text>

  <rect x="600" y="382" width="230" height="62" rx="8" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="715" y="408" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">Local Persistence</text>
  <text x="715" y="426" font-size="10" text-anchor="middle" fill="#475569">Expo SecureStore &amp; AsyncStorage</text>

  <!-- Arrow 3 to 4 -->
  <line x1="450" y1="460" x2="450" y2="490" stroke="#334155" stroke-width="2.5" marker-start="url(#archArrow)" marker-end="url(#archArrow)"/>

  <!-- Layer 4: Backend & Database -->
  <rect x="50" y="490" width="800" height="100" rx="12" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  <text x="70" y="515" font-size="14" font-weight="bold" fill="#0F172A">4. BACKEND INFRASTRUCTURE (REST API &amp; RELATIONAL DATABASE)</text>

  <rect x="70" y="525" width="365" height="50" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="252" y="548" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">RESTful API Endpoints (JSON over HTTPS)</text>
  <text x="252" y="564" font-size="10" text-anchor="middle" fill="#475569">/api/register, /api/login, /api/tasks, /api/profile</text>

  <rect x="465" y="525" width="365" height="50" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="647" y="548" font-size="12" font-weight="bold" text-anchor="middle" fill="#0F172A">Database Relasional (MySQL / PostgreSQL)</text>
  <text x="647" y="564" font-size="10" text-anchor="middle" fill="#475569">Tabel users (1) ----&lt; (N) Tabel tasks</text>
</svg>

