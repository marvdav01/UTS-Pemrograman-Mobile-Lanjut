<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" width="840" height="400" font-family="Segoe UI, Arial, sans-serif">
  <rect width="840" height="400" fill="#F8FAFC"/>
  <text x="420" y="34" font-size="18" font-weight="bold" text-anchor="middle" fill="#0F172A">ENTITY RELATIONSHIP DIAGRAM (ERD) – DAILYTASK</text>

  <!-- Table USERS -->
  <rect x="50" y="80" width="280" height="215" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <rect x="50" y="80" width="280" height="42" rx="10" fill="#2563EB"/>
  <text x="190" y="106" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">TABEL: users</text>

  <text x="68" y="146" font-size="12" font-weight="bold" fill="#D97706">PK</text>
  <text x="105" y="146" font-size="12" font-weight="bold" fill="#0F172A">id</text>
  <text x="215" y="146" font-size="11" fill="#475569">BIGINT UNSIGNED</text>

  <line x1="60" y1="156" x2="320" y2="156" stroke="#E2E8F0"/>
  <text x="105" y="178" font-size="12" fill="#0F172A">name</text>
  <text x="215" y="178" font-size="11" fill="#475569">VARCHAR(100)</text>

  <text x="68" y="206" font-size="11" font-weight="bold" fill="#0284C7">UK</text>
  <text x="105" y="206" font-size="12" fill="#0F172A">email</text>
  <text x="215" y="206" font-size="11" fill="#475569">VARCHAR(150)</text>

  <text x="105" y="234" font-size="12" fill="#0F172A">password</text>
  <text x="215" y="234" font-size="11" fill="#475569">VARCHAR(255)</text>

  <text x="105" y="262" font-size="12" fill="#0F172A">created_at</text>
  <text x="215" y="262" font-size="11" fill="#475569">TIMESTAMP</text>

  <!-- Relationship Line 1 : N -->
  <line x1="330" y1="142" x2="500" y2="168" stroke="#0F172A" stroke-width="2.5"/>
  <!-- 1 Symbol -->
  <line x1="348" y1="133" x2="348" y2="153" stroke="#0F172A" stroke-width="2.5"/>
  <!-- Crow's Foot (Many) Symbol -->
  <line x1="482" y1="165" x2="500" y2="156" stroke="#0F172A" stroke-width="2.5"/>
  <line x1="482" y1="165" x2="500" y2="178" stroke="#0F172A" stroke-width="2.5"/>
  <rect x="372" y="128" width="90" height="26" rx="13" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="417" y="145" font-size="11" font-weight="bold" text-anchor="middle" fill="#14532D">memiliki (1:N)</text>

  <!-- Table TASKS -->
  <rect x="500" y="60" width="295" height="310" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
  <rect x="500" y="60" width="295" height="42" rx="10" fill="#16A34A"/>
  <text x="647" y="86" font-size="14" font-weight="bold" text-anchor="middle" fill="#FFFFFF">TABEL: tasks</text>

  <text x="518" y="126" font-size="12" font-weight="bold" fill="#D97706">PK</text>
  <text x="555" y="126" font-size="12" font-weight="bold" fill="#0F172A">id</text>
  <text x="665" y="126" font-size="11" fill="#475569">BIGINT UNSIGNED</text>

  <text x="518" y="156" font-size="12" font-weight="bold" fill="#16A34A">FK</text>
  <text x="555" y="156" font-size="12" font-weight="bold" fill="#0F172A">user_id</text>
  <text x="665" y="156" font-size="11" fill="#475569">BIGINT UNSIGNED</text>

  <line x1="510" y1="168" x2="785" y2="168" stroke="#E2E8F0"/>
  <text x="555" y="192" font-size="12" fill="#0F172A">title</text>
  <text x="665" y="192" font-size="11" fill="#475569">VARCHAR(200)</text>

  <text x="555" y="218" font-size="12" fill="#0F172A">description</text>
  <text x="665" y="218" font-size="11" fill="#475569">TEXT (NULLABLE)</text>

  <text x="555" y="244" font-size="12" fill="#0F172A">priority</text>
  <text x="665" y="244" font-size="11" fill="#475569">ENUM(low,medium,high)</text>

  <text x="555" y="270" font-size="12" fill="#0F172A">due_date</text>
  <text x="665" y="270" font-size="11" fill="#475569">DATETIME</text>

  <text x="555" y="296" font-size="12" fill="#0F172A">status</text>
  <text x="665" y="296" font-size="11" fill="#475569">ENUM(pending,in_progress,completed)</text>

  <text x="555" y="322" font-size="12" fill="#0F172A">created_at</text>
  <text x="665" y="322" font-size="11" fill="#475569">TIMESTAMP</text>

  <text x="555" y="348" font-size="12" fill="#0F172A">updated_at</text>
  <text x="665" y="348" font-size="11" fill="#475569">TIMESTAMP</text>
</svg>

